name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arma-actions/hemtt@v1
      - name: Build release
        run: hemtt release
      - uses: actions/upload-artifact@v4
        with:
          name: SmartAI
          path: releases/*.zip
